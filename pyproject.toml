[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc2donjon"
version = "0.1.4"
description = "Convert OpenMC MGXS library HDF5 files to DRAGON/DONJON L_MULTICOMPO ASCII."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bowen Cui"},
]
keywords = [
  "openmc",
  "dragon",
  "donjon",
  "neutronics",
  "reactor-physics",
  "mgxs",
  "homogenization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "h5py>=3.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.14,<2",
  # ``fastapi.testclient`` pulls ``httpx`` lazily; pin it in dev so the
  # web-backend test suite can construct ``TestClient`` without
  # bloating the production ``[web]`` extra.
  "httpx>=0.27,<1",
]
web = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/arbreCui/openmc2donjon"
Repository = "https://github.com/arbreCui/openmc2donjon"
Issues = "https://github.com/arbreCui/openmc2donjon/issues"

[project.scripts]
openmc2donjon = "openmc2donjon.cli:main"
openmc2donjon-export = "openmc2donjon.export_cli:main"
openmc2donjon-from-openmc = "openmc2donjon.from_openmc_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmc2donjon = [
  "data/energy_meshes/*.json",
  "web/fixtures/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
show_error_codes = true
# Most of the codebase is dynamic (HDF5 attrs, argparse Namespaces, subprocess
# payloads). The base config stays lenient and per-module strict gating is
# applied via overrides below; `warn_redundant_casts` is a mypy global-only
# knob so it lives at the top level rather than inside each override.
follow_imports = "silent"
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

# Strict gating for pure-logic modules. Expand the list as other modules
# become clean; `no_implicit_reexport` is intentionally left off because
# the package relies on `from .x import y` re-export shorthand in several
# places (re-exports are marked with `# noqa: F401` for ruff).
[[tool.mypy.overrides]]
module = [
  "openmc2donjon.constants",
  "openmc2donjon.scatter",
  "openmc2donjon.energy_groups",
  "openmc2donjon.mgxs_physics_checks",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true
