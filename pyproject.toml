[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc2donjon"
version = "0.1.2"
description = "Convert OpenMC MGXS library HDF5 files to DRAGON/DONJON L_MULTICOMPO ASCII."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bowen Cui"},
]
keywords = [
  "openmc",
  "dragon",
  "donjon",
  "neutronics",
  "reactor-physics",
  "mgxs",
  "homogenization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "h5py",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/arbreCui/openmc2donjon"
Repository = "https://github.com/arbreCui/openmc2donjon"
Issues = "https://github.com/arbreCui/openmc2donjon/issues"

[project.scripts]
openmc2donjon = "openmc2donjon.cli:main"
openmc2donjon-export = "openmc2donjon.export_cli:main"
openmc2donjon-from-openmc = "openmc2donjon.from_openmc_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmc2donjon = ["templates/*.x2m.in", "data/energy_meshes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
